[project]
name = "r2d2-sdk-auth"
version = "0.1.0"
description = "Typed Python SDK for R2D2 API authentication"
readme = "README.md"
requires-python = ">=3.13"
license = { file = "LICENSE" }
dependencies = [
    "httpx>=0.28.1",
    "pydantic[email]>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/r2d2_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=r2d2_sdk --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
